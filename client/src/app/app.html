<ng-container *transloco="let t">
  <header class="app-header">
    <a class="brand" routerLink="/">
      <span class="brand-mark" aria-hidden="true">%</span>
      <span>{{ t('app.title') }}</span>
    </a>

    <div class="header-actions">
      <div class="lang-switch" role="group" [attr.aria-label]="t('app.language')">
        @for (lang of languages; track lang) {
          <button
            type="button"
            [class.active]="language.current() === lang"
            [attr.aria-pressed]="language.current() === lang"
            (click)="setLanguage(lang)"
          >
            {{ lang.toUpperCase() }}
          </button>
        }
      </div>

      @if (authStatus() === 'authenticated') {
        <a class="list-link" routerLink="/seznam" [attr.aria-label]="t('list.title')">
          <span aria-hidden="true">🛒</span>
          @if (shoppingList.openCount() > 0) {
            <span class="count">{{ shoppingList.openCount() }}</span>
          }
        </a>
        <a class="icon-link" routerLink="/nastavitve" [attr.aria-label]="t('settings.title')">
          <span aria-hidden="true">⚙️</span>
        </a>
        <button type="button" class="link-button" (click)="logout()">{{ t('app.logout') }}</button>
      }
    </div>
  </header>

  @if (!online()) {
    <p class="offline-banner" role="status">{{ t('app.offline') }}</p>
  }
</ng-container>

<main class="app-main">
  <router-outlet />
</main>

<footer class="app-footer">
  © {{ year }} Nik Perne ·
  <a href="https://github.com/NikPerne/reklame-popusti" target="_blank" rel="noopener noreferrer"
    >GitHub</a
  >
</footer>
