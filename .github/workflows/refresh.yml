name: Refresh offers

on:
  schedule:
    # Once a day at 04:05 UTC (05:05/06:05 Slovenian time). Discounts run for days, so once is
    # enough, and Spar's robots.txt only allows visits between 04:00 and 08:45 UTC. Its full
    # catalogue (10 s per page) takes about 75 minutes; Spar stops by itself at 08:45.
    - cron: '5 4 * * *'
  workflow_dispatch:

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Mercator ~10 min, Spar ~75 min, the rest a few minutes.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --workspace server
      - run: npm run build -w server
      - run: npm run refresh -w server
        env:
          NODE_ENV: production
          LOG_LEVEL: info
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
